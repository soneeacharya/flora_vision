<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌿 Plantopedia Classifier</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>🌱 Plantopedia - Identify Your Plant</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">Predict</button>
        </form>

        {% if uploaded_image_url %}
            <div class="preview">
                <img src="{{ uploaded_image_url }}" alt="Uploaded image" width="200">
                <h2>Prediction: {{ result }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
